<!DOCTYPE html>
<html>
<head>
    <title>Add Two Numbers</title>
</head>
<body>

<script>
function add(a, b) {
    return a + b;
}

let num1 = Number(prompt("Enter first number:"));
let num2 = Number(prompt("Enter second number:"));

let result = add(num1, num2);

alert("Sum = " + result);
console.log("Sum = " + result);
</script>

</body>
</html>
